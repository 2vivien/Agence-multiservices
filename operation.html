<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Opérations - Agence Multiservice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f5f7fa; }
        .table-action-btn { transition: color 0.2s ease-in-out; }
        .modal { display: none; } /* Basic modal styling if needed later */
        .form-input, .form-select, .form-textarea {
            border-color: #e2e8f0;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #3b82f6; /* blue-500 */
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100">
    <script src="public/js/common.js"></script>
    <script src="public/js/operation.js" defer></script>

    <!-- Navigation (Placeholder - could be included via JS or server-side) -->
    <nav class="bg-indigo-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="gerant-dashboard.html" class="text-xl font-semibold">Agence Multiservice</a>
            <div>
                <a href="gerant-dashboard.html" class="px-3 hover:text-indigo-300">Dashboard</a>
                <a href="operation.html" class="px-3 hover:text-indigo-300 font-bold">Opérations</a>
                <!-- Add other nav links as needed -->
                <button id="nav-logout-button" class="px-3 hover:text-indigo-300">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Gestion des Opérations</h1>

        <!-- Global Notification Area -->
        <div id="global-notification" class="hidden mb-4 p-4 rounded-md text-white"></div>

        <!-- Operation Form Card -->
        <div class="bg-white shadow-xl rounded-lg p-6 mb-8">
            <h2 id="form-title" class="text-2xl font-semibold text-gray-700 mb-4">Ajouter une Nouvelle Opération</h2>
            <div id="form-loading" class="hidden animate-pulse text-gray-500 mb-4">Chargement du formulaire...</div>

            <form id="operation-form" class="space-y-4">
                <input type="hidden" id="form-operation-id">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="form-service-id" class="block text-sm font-medium text-gray-700 mb-1">Service <span class="text-red-500">*</span></label>
                        <select id="form-service-id" name="service_id" class="form-select block w-full py-2 px-3 border rounded-md shadow-sm focus:outline-none sm:text-sm" required>
                            <option value="">Chargement des services...</option>
                        </select>
                        <p class="text-xs text-red-500 mt-1 hidden" id="error-service-id"></p>
                    </div>
                    <div>
                        <label for="form-operation-type-id" class="block text-sm font-medium text-gray-700 mb-1">Type d'Opération <span class="text-red-500">*</span></label>
                        <select id="form-operation-type-id" name="operation_type_id" class="form-select block w-full py-2 px-3 border rounded-md shadow-sm focus:outline-none sm:text-sm" required>
                            <option value="">Chargement des types...</option>
                        </select>
                        <p class="text-xs text-red-500 mt-1 hidden" id="error-operation-type-id"></p>
                    </div>
                </div>

                <div>
                    <label for="form-amount" class="block text-sm font-medium text-gray-700 mb-1">Montant <span class="text-red-500">*</span></label>
                    <input type="number" id="form-amount" name="amount" step="0.01" class="form-input block w-full py-2 px-3 border rounded-md shadow-sm focus:outline-none sm:text-sm" required placeholder="0.00">
                    <p class="text-xs text-red-500 mt-1 hidden" id="error-amount"></p>
                </div>

                <div>
                    <label for="form-operation-time" class="block text-sm font-medium text-gray-700 mb-1">Date et Heure <span class="text-red-500">*</span></label>
                    <input type="datetime-local" id="form-operation-time" name="operation_time" class="form-input block w-full py-2 px-3 border rounded-md shadow-sm focus:outline-none sm:text-sm" required>
                    <p class="text-xs text-red-500 mt-1 hidden" id="error-operation-time"></p>
                </div>

                <div>
                    <label for="form-description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="form-description" name="description" rows="3" class="form-textarea block w-full py-2 px-3 border rounded-md shadow-sm focus:outline-none sm:text-sm" placeholder="Entrez une description ou une note..."></textarea>
                    <p class="text-xs text-red-500 mt-1 hidden" id="error-description"></p>
                </div>

                <!-- Other fields like commission_applied, reference_id, balance_id can be added if direct user input is needed -->

                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" id="reset-form-button" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Annuler
                    </button>
                    <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        <i class="fas fa-plus-circle mr-1"></i> <span id="form-submit-button-text">Ajouter Opération</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Operations Table Card -->
        <div class="bg-white shadow-xl rounded-lg p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-semibold text-gray-700">Liste des Opérations</h2>
                <div class="flex space-x-2">
                    <button id="export-ops-pdf-btn" class="bg-red-500 hover:bg-red-700 text-white font-semibold py-2 px-3 rounded-md text-sm">
                        <i class="fas fa-file-pdf mr-1"></i> PDF
                    </button>
                    <button id="export-ops-excel-btn" class="bg-green-500 hover:bg-green-700 text-white font-semibold py-2 px-3 rounded-md text-sm">
                        <i class="fas fa-file-excel mr-1"></i> Excel
                    </button>
                </div>
            </div>
            <div id="table-loading" class="animate-pulse text-gray-500 mb-4">Chargement des opérations...</div>
            <div class="overflow-x-auto">
                <table id="operations-table" class="min-w-full divide-y divide-gray-200"> <!-- Added id="operations-table" -->
                    <thead class="bg-gray-50">
                        <tr>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date/Heure</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Service</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Montant</th>
                            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="operations-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- JS will populate this -->
                        <tr><td colspan="6" class="text-center py-4 text-gray-500">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div id="operations-pagination-controls" class="mt-6 flex flex-col items-center space-y-2 sm:flex-row sm:justify-between">
                <div id="operations-pagination-info" class="text-sm text-gray-700">
                    Page <span id="operations-current-page" class="font-medium">1</span>
                    sur <span id="operations-total-pages" class="font-medium">1</span>.
                    Total: <span id="operations-total-records" class="font-medium">0</span> opérations.
                </div>
                <div class="inline-flex mt-2 xs:mt-0">
                    <button id="operations-prev-page-btn" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-l hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fas fa-arrow-left mr-1"></i> Préc.
                    </button>
                    <button id="operations-next-page-btn" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-r border-0 border-l border-indigo-700 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                        Suiv. <i class="fas fa-arrow-right ml-1"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Attach logout to nav button if it exists
        document.addEventListener('DOMContentLoaded', () => {
            const navLogoutButton = document.getElementById('nav-logout-button');
            if (navLogoutButton && typeof logoutUser === 'function') {
                navLogoutButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    logoutUser();
                });
            }
        });
    </script>
</body>
</html>
