<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Résumés de Journée - Agence Multiservice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f5f7fa; }
        .filter-section { background-color: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1.5rem;}
        .table-container { background-color: white; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-100">
    <script src="public/js/common.js"></script>
    <script src="public/js/resume_jour.js" defer></script>

    <!-- Gérant Navigation -->
    <nav class="bg-indigo-900 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <a href="gerant-dashboard.html" class="text-xl font-semibold">Agence Multiservice</a>
            <div>
                <a href="gerant-dashboard.html" class="px-3 hover:text-indigo-300">Dashboard</a>
                <a href="operation.html" class="px-3 hover:text-indigo-300">Opérations</a>
                <a href="resume_jour.html" class="px-3 hover:text-indigo-300 font-bold">Mes Résumés</a>
                <a href="cloture.html" class="px-3 hover:text-indigo-300">Clôture</a>
                <button id="nav-logout-button" class="px-3 hover:text-indigo-300">Déconnexion</button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">Mes Résumés de Journée</h1>

        <!-- Global Notification Container (from common.js) -->
        <!-- <div id="global-notification-container" class="fixed top-5 right-5 z-50 w-full max-w-sm"></div> -->

        <!-- Filters Section -->
        <div class="filter-section">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label for="filter-date-gerant" class="block text-sm font-medium text-gray-700">Date Spécifique</label>
                    <input type="date" id="filter-date-gerant" class="mt-1 block w-full py-2 px-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="filter-date-from-gerant" class="block text-sm font-medium text-gray-700">De (Date)</label>
                    <input type="date" id="filter-date-from-gerant" class="mt-1 block w-full py-2 px-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="filter-date-to-gerant" class="block text-sm font-medium text-gray-700">À (Date)</label>
                    <input type="date" id="filter-date-to-gerant" class="mt-1 block w-full py-2 px-3 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="flex space-x-2">
                    <button id="apply-filters-btn-gerant" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md shadow-sm">
                        <i class="fas fa-filter mr-1"></i> Filtrer
                    </button>
                    <button id="reset-filters-btn-gerant" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded-md shadow-sm">
                        <i class="fas fa-undo mr-1"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Summaries Table -->
        <div id="gerant-table-loading" class="text-center py-10 hidden">
            <i class="fas fa-spinner fa-spin text-4xl text-indigo-600"></i>
            <p class="mt-2 text-gray-600">Chargement de vos résumés...</p>
        </div>
        <div class="table-container overflow-x-auto" id="gerant-summaries-table-container">
            <table id="gerant-summaries-table" class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Solde Initial</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Solde Théorique</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Solde Réel Constaté</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider text-right">Écart</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Notes</th>
                        <th class="px-3 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Clôturé le</th>
                    </tr>
                </thead>
                <tbody id="gerant-summaries-table-body" class="bg-white divide-y divide-gray-200">
                    <!-- JS will populate this -->
                    <tr><td colspan="7" class="text-center py-4 text-gray-500">Veuillez appliquer des filtres pour voir vos résumés.</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div id="gerant-pagination-controls" class="mt-6 flex flex-col items-center space-y-2 sm:flex-row sm:justify-between">
            <div id="gerant-pagination-info" class="text-sm text-gray-700">
                Page <span id="gerant-current-page" class="font-medium">1</span> sur <span id="gerant-total-pages" class="font-medium">1</span>. Total: <span id="total-records" class="font-medium">0</span> résumés.
            </div>
            <div class="inline-flex mt-2 xs:mt-0">
                <button id="gerant-prev-page-btn" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-l hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-arrow-left mr-1"></i> Préc.
                </button>
                <button id="gerant-next-page-btn" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-r border-0 border-l border-indigo-700 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed">
                    Suiv. <i class="fas fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Attach logout to nav button
        document.addEventListener('DOMContentLoaded', () => {
            const navLogoutButton = document.getElementById('nav-logout-button');
            if (navLogoutButton && typeof logoutUser === 'function') {
                navLogoutButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    logoutUser();
                });
            }
        });
    </script>
</body>
</html>
